<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>20 分钟</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <span class="dot" id="phase-dot"></span>
    <h1>20 分钟</h1>
    <span class="phase" id="phase-label">空闲</span>
  </div>
  <div class="today" id="today">今天还没有记录</div>
</header>

<main>
  <section class="card" id="current" hidden>
    <div class="current-top">
      <div>
        <div class="eyebrow" id="current-task">—</div>
        <div class="clock" id="clock">20:00</div>
        <div class="sub" id="current-sub"></div>
      </div>
      <div class="actions" id="current-actions">
        <button data-action="pause" class="ghost" id="pause-btn">暂停</button>
        <button data-action="end" class="primary">结束本段</button>
        <button data-action="cancel" class="danger ghost">放弃</button>
      </div>
    </div>
    <p class="warn" id="warn"></p>
  </section>

  <section class="card feedback" id="feedback" hidden>
    <h2>这一段怎么样？</h2>
    <p class="sub" id="feedback-sub"></p>
    <form id="feedback-form">
      <div class="statuses" id="statuses"></div>
      <label class="field">
        <span>一句话：做了什么 / 卡在哪</span>
        <textarea id="feedback-content" rows="3" maxlength="500"
                  placeholder="例如：把 diff 第一问算完了，第二问卡在符号处理"></textarea>
      </label>
      <div class="feedback-foot">
        <label class="field inline">
          <span>接下来</span>
          <select id="feedback-next">
            <option value="same_task">继续这个任务</option>
            <option value="choose_task">休息后换个任务</option>
            <option value="finish">今天先到这</option>
          </select>
        </label>
        <button type="submit" class="primary" id="feedback-submit">保存并休息</button>
      </div>
      <p class="hint">选择「任务完成」才会把 dstask 里的这条待办标记完成。</p>
    </form>
  </section>

  <section class="card" id="break" hidden>
    <div class="current-top">
      <div>
        <div class="eyebrow">休息</div>
        <div class="clock" id="break-clock">05:00</div>
        <div class="sub">站起来，看远处，喝水</div>
      </div>
      <div class="actions">
        <button data-action="skip-break" class="ghost">跳过休息</button>
      </div>
    </div>
  </section>

  <section class="card" id="picker">
    <div class="picker-head">
      <h2>开始下一段</h2>
      <div class="picker-tools">
        <button id="refresh-tasks" class="ghost small">刷新</button>
        <button id="sync-tasks" class="ghost small">同步</button>
      </div>
    </div>
    <p class="sub" id="last-hint" hidden></p>
    <ul class="tasks" id="tasks"></ul>
    <form id="add-form" class="add">
      <input id="new-desc" placeholder="新任务" maxlength="1000" required>
      <input id="new-project" placeholder="project（可选）" maxlength="100">
      <button type="submit" class="ghost">添加</button>
    </form>
  </section>

  <section class="card">
    <div class="picker-head">
      <h2>记录</h2>
      <input type="date" id="history-date">
    </div>
    <p class="sub" id="history-summary"></p>
    <div class="table-wrap">
      <table id="history">
        <thead>
          <tr>
            <th>开始</th><th>结束</th><th>时长</th><th>任务</th><th>反馈</th><th>下一步</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
  <p class="error" id="error" role="alert"></p>
</main>
<script src="/app.js"></script>
</body>
</html>
